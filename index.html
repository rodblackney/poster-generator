<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poster Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter+Tight:ital,wght@0,300..900;1,300..900&family=Instrument+Serif:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=JetBrains+Mono:wght@400;500;700&family=Lexend+Peta:wght@100..700&family=Unbounded:wght@300..900&display=block">
<link id="jpcss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&display=block&text=%E5%A4%A7%E9%98%AA%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%9C%AD%E5%B9%8C%E7%A5%9E%E6%88%B8%E5%A5%88%E8%89%AF%E5%85%89%E3%81%A8%E5%BD%B1%E3%81%AE%E5%8D%9A%E8%A6%A7%E4%BC%9A%E6%9C%AA%E6%9D%A5%E9%83%BD%E5%B8%82%E9%9D%99%E3%81%8B%E3%81%AA%E4%BF%A1%E5%8F%B7%E5%A4%9C%E9%9F%B3%E6%A5%BD%E6%B5%85%E3%81%84%E5%A4%A2%E6%B3%A2%E9%A2%A8%E6%99%AF">
<style>
:root{
  /* Layout: an endless dark pin-board of generated posters; chrome is small mono labels floating at the edges */
  --wall:#0d0d0f; --ink:#ecebe6; --mute:#8b8a92; --line:#2a2a30; --glass:rgba(18,18,22,.86); --accent:#5b6bff;
  --ui:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Inter Tight',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);overflow:hidden;font-family:var(--sans)}
#view{position:fixed;inset:0;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.poster{position:absolute;width:600px;height:800px;background:#1a1a1d;overflow:hidden;transition:opacity .35s;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.poster svg{display:block;width:100%;height:100%}
.poster .grid{position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none}
.poster:hover .grid,.poster.showgrid .grid{opacity:1}
body.focus .poster{opacity:.22}
body.focus .poster.on{opacity:1}
body.nogrid .poster .grid{display:none}
.bar{position:fixed;display:flex;gap:10px;align-items:center;font:500 11px/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;z-index:5}
#top{top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
.brand b{font-weight:700;color:var(--ink)} .brand span{color:var(--mute);margin-left:12px}
button,.chip{font:500 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:9px 12px;border-radius:2px;cursor:pointer;backdrop-filter:blur(8px)}
button:hover,.chip:hover{border-color:var(--mute)}
button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="false"]{color:var(--mute);background:transparent}
#chips{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:16px;right:16px;flex-wrap:wrap;justify-content:center}
#hint{position:fixed;left:16px;bottom:calc(60px + env(safe-area-inset-bottom,0px));font:500 10px var(--ui);letter-spacing:.08em;color:var(--mute);text-transform:uppercase;z-index:5}
#panel{max-width:min(980px,calc(100vw - 32px))!important;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);padding:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);box-sizing:border-box;backdrop-filter:blur(10px)}
#panel button{background:transparent}
#panel label{display:flex;gap:6px;align-items:center;color:var(--mute)}
#panel input{font:500 12px var(--sans);letter-spacing:0;text-transform:none;background:#0006;color:var(--ink);border:1px solid var(--line);padding:7px 8px;width:130px;border-radius:2px}
#stylename{min-width:96px;text-align:center;color:var(--ink)}
#ftop{top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;justify-content:space-between}
#fmeta{color:var(--mute)}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--wall);font:500 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:500 11px var(--ui);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
@media (max-width:640px){#panel input{width:120px} #hint{display:none} .brand span{display:none}}
@media (prefers-reduced-motion:reduce){.poster{transition:none}}
</style>
</head>
<body class="">
<div id="loading">Setting type…</div>
<div id="view"><div id="world"></div></div>

<div id="top" class="bar">
  <div class="brand"><b>Poster Wall</b><span id="count">∞ generated · drag to explore</span></div>
  <div style="display:flex;gap:8px"><button id="gridBtn" title="Grid overlay (G)">Grid</button><button id="shuffle" title="New wall (S)">Shuffle wall</button></div>
</div>
<div id="hint">Drag or scroll to move · pinch / ctrl+scroll to zoom · click a poster</div>
<div id="chips" class="bar"></div>

<div id="ftop" class="bar" hidden>
  <button id="back">← Wall</button>
  <div id="fmeta"></div>
</div>
<div id="panel" class="bar" hidden>
  <button id="prevS" aria-label="Previous style">‹</button><span id="stylename"></span><button id="nextS" aria-label="Next style">›</button>
  <button id="remix" title="R">Remix</button>
  <button id="colour" title="C">Colour</button>
  <label for="t1">Text <input id="t1" autocomplete="off"></label>
  <label for="t2">Line 2 <input id="t2" autocomplete="off"></label>
  <button id="reset">Reset</button>
  <button id="png">PNG ↓</button>
  <button id="link">Copy link</button>
</div>
<div id="toast"></div>

<script>
/* ============ utilities ============ */
const W=600,H=800,G=56;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(...n){let h=2166136261>>>0;for(const v of n){h^=v|0;h=Math.imul(h,16777619);h^=h>>>13;h=Math.imul(h,2246822507)}return h>>>0}
function mkR(seed){const r=mulberry(seed);const o={r,range:(a,b)=>a+(b-a)*r(),int:(a,b)=>Math.floor(a+(b-a+1)*r()),pick:a=>a[Math.floor(r()*a.length)],chance:p=>r()<p,shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}};return o}
const f1=n=>Math.round(n*10)/10;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SANS="'Inter Tight', Helvetica, Arial, sans-serif", ARCH="'Archivo', 'Arial Narrow', sans-serif", SERIF="'Instrument Serif', Georgia, serif", FRAUN="'Fraunces', Georgia, serif", MONO="'JetBrains Mono', Menlo, monospace", WIDE="'Lexend Peta', 'Arial', sans-serif", UNB="'Unbounded', 'Arial Black', sans-serif", JP="'Noto Sans JP', sans-serif";
const _mc=document.createElement('canvas').getContext('2d');
function mw(str,size,fam,wt=400,it=''){_mc.font=`${it} ${wt} ${size}px ${fam}`;return _mc.measureText(str).width}
function fit(str,maxW,fam,wt,maxS,ls=0){const w=mw(str,100,fam,wt)+ls*100/1*0;return Math.min(maxS,maxW/(w/100+ls*str.length/100*0))}
function tx(x,y,str,o={}){
  const a=[`x="${f1(x)}"`,`y="${f1(y)}"`,`font-family="${o.f||SANS}"`,`font-size="${f1(o.s||12)}"`];
  if(o.w)a.push(`font-weight="${o.w}"`);a.push(`fill="${o.c||'#000'}"`);
  if(o.a)a.push(`text-anchor="${o.a}"`);if(o.ls!=null)a.push(`letter-spacing="${o.ls}"`);
  if(o.tl)a.push(`textLength="${f1(o.tl)}" lengthAdjust="spacingAndGlyphs"`);
  if(o.tr)a.push(`transform="${o.tr}"`);if(o.st)a.push(`style="${o.st}"`);
  if(o.it)a.push(`font-style="italic"`);if(o.stroke)a.push(`stroke="${o.stroke}" stroke-width="${o.sw||1}"`);
  if(o.op!=null)a.push(`opacity="${o.op}"`);
  return `<text ${a.join(' ')}>${esc(str)}</text>`}
const tl=(x,y,lines,lh,o)=>lines.map((l,i)=>tx(x,y+i*lh,l,o)).join('');
function wrap(str,n){const w=str.split(' ');const L=[];let c='';for(const x of w){if((c+' '+x).trim().length>n&&c){L.push(c);c=x}else c=(c+' '+x).trim()}if(c)L.push(c);return L}
function smooth(pts,closed){const n=pts.length;let d=`M${f1(pts[0][0])},${f1(pts[0][1])}`;const g=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];const m=closed?n:n-1;for(let i=0;i<m;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)},${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)},${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])},${f1(p2[1])}`}return d+(closed?'Z':'')}
const poly=pts=>pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ');
const pad=n=>String(n).padStart(2,'0');
const fmt=n=>n.toLocaleString('en-US');

/* shared textures */
function grainF(id,dark){return `<filter id="${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 ${dark?1:0}  0 0 0 0 ${dark?1:0}  0 0 0 0 ${dark?1:0}  0 0 0 -3.2 1.75"/></filter>`}
function wrinkleF(id,seed,fx=.006,fy=.02){return `<filter id="${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${fx} ${fy}" numOctaves="4" seed="${seed%999}"/><feDiffuseLighting lighting-color="#fff" surfaceScale="3"><feDistantLight azimuth="45" elevation="58"/></feDiffuseLighting><feComponentTransfer><feFuncR type="linear" slope="1.2" intercept=".02"/><feFuncG type="linear" slope="1.2" intercept=".02"/><feFuncB type="linear" slope="1.2" intercept=".02"/></feComponentTransfer></filter>`}
const paperFX=(u,seed,op=.6)=>({defs:wrinkleF(u+'wr',seed),el:`<rect width="600" height="800" filter="url(#${u}wr)" style="mix-blend-mode:multiply" opacity="${op}"/><line x1="300" y1="0" x2="300" y2="800" stroke="#000" opacity=".1"/><line x1="301.5" y1="0" x2="301.5" y2="800" stroke="#fff" opacity=".18"/><line x1="0" y1="400" x2="600" y2="400" stroke="#000" opacity=".1"/><line x1="0" y1="401.5" x2="600" y2="401.5" stroke="#fff" opacity=".18"/>`});

/* ============ copy ============ */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const NAMES=['Mira Oduya','Kasper Lind','Tomo Arai','Nell Vargas','Odile Fen','Ravi Moss','June Halloran','Beni Okafor','Sol Duarte','Ines Kowal','Ada Sorel','Felix Amari','Noor Haddad','Lio Brandt','Wren Castillo','Yuki Moreau'];
const CITIES=['Girona','Geneva','Lisbon','Berlin','Glasgow','Montréal','Melbourne','Oslo','Seoul','Leeds','Porto','Detroit','Bristol','Ghent'];
const VENUES=['Hall Four','The Annex','Warehouse 9','Room Two','Pier 31','Studio B','Club Ozone','The Basement','Sala Nova','Dock Eleven'];
const STREETS=['Carrer del Sol','Rue des Bains','Dock Road','Harbour Lane','Via Lattea','Canal Street','Mill Row'];
const PAIRS=[['LATE','BLOOM'],['LOW','TIDE'],['HEAT','WAVE'],['DEEP','FIELD'],['OPEN','DOORS'],['SOFT','NOISE'],['NIGHT','SWIM'],['SLOW','MOTION'],['BLUE','HOUR'],['FREE','FORM'],['HARD','LIGHT'],['WILD','CARD'],['SUN','RISE'],['NEW','ROUTES']];
const BIG=['CALLISTO','TITAN','PHOBOS','OBERON','SOLARIS','HALCYON','APHELION','VANTAGE','MERIDIAN','PARALLAX','OZONE','DRIFT','TIDAL','ZENITH','NADIR','ORBITAL'];
const HUDW=['ISOLATION','GRAVITY','EXPEDITION','SIGNAL','DESCENT','VELOCITY','SILICA','THRESHOLD','RESONANCE','HORIZON','VECTOR','PROBE','CALIBRATION','TELEMETRY'];
const PHRASES=['EVERY ROOM HAS A SECOND DOOR','SIGNAL OVER NOISE','THE QUIET PART LOUD','FIELD RECORDINGS FROM ELSEWHERE','STRUCTURE WITHOUT SCAFFOLD','RECORDED LIVE TO TAPE','FOR THE LATE ONES','LOOP RESEARCH UNIT','A HEAT MAP OF A SMALL CITY','NOTHING STAYS STILL','NEW ROUTINES FOR OLD ROOMS'];
const MIXES=['(Night Edit)','(Dub Version)','(Long Play)','(Live Session)','(Club Mix)','(Slow Version)','(Reprise)'];
const CLASSES=['Mesosiderite','Chondrite','Pallasite','Eucrite','Howardite','Iron, IAB','Achondrite'];
const FOUND=['Antarctica','Sahara','Oman','Atacama','Nullarbor','Lut Desert'];
const ORIGIN=['Asteroid','Mars','Moon','Vesta','Unknown'];
const SCANS=['R. Ito · 3D survey','M. Vale · photogrammetry','L. Okoro · CT scan','S. Brandt · laser scan'];

/* ============ styles ============ */
const ST={};

/* --- 1. Specimen (A. Artifacts) --- */
function rockSVG(R,u,k,cx,cy,r,light){
  const n=44,ph=[R.r()*6.3,R.r()*6.3,R.r()*6.3],a1=R.range(.08,.18),a2=R.range(.04,.1),a3=R.range(.02,.05),sx=R.range(.8,1.15),sy=R.range(.8,1.1),rot=R.r()*6.3,pk=R.int(0,n-1);
  const pts=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;let rr=r*(1+a1*Math.sin(2*t+ph[0])+a2*Math.sin(3*t+ph[1])+a3*Math.sin(7*t+ph[2])+R.range(-.025,.025));if(Math.abs(i-pk)<2)rr*=1.18-Math.abs(i-pk)*.07;let x=Math.cos(t)*rr*sx,y=Math.sin(t)*rr*sy;pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}
  const d=smooth(pts,true),id=u+'rk'+k;
  const tone=light?R.pick(['#8a8378','#5d5852','#3d3a37','#a39b8e']):'#b9b9b9';
  return {defs:`<filter id="${id}f" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="${f1(R.range(.02,.045)*100)/100}" numOctaves="5" seed="${R.int(1,900)}"/><feDiffuseLighting surfaceScale="${R.int(4,8)}" lighting-color="${tone}"><feDistantLight azimuth="225" elevation="38"/></feDiffuseLighting><feComponentTransfer><feFuncR type="linear" slope="1.35" intercept="-.12"/><feFuncG type="linear" slope="1.35" intercept="-.12"/><feFuncB type="linear" slope="1.35" intercept="-.12"/></feComponentTransfer><feComposite in2="SourceAlpha" operator="in"/></filter><radialGradient id="${id}g" cx=".35" cy=".3" r=".85"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#222"/></radialGradient>`,
    el:`<g><path d="${d}" fill="#888" filter="url(#${id}f)"/><path d="${d}" fill="url(#${id}g)" style="mix-blend-mode:multiply"/></g>`}
}
const FACTS=[
  (R,c)=>{const n=R.int(40,400)*1000;return{num:fmt(n),unit:'triangles',s1:`The recorded mesh of ${c} is made of ${fmt(n)} triangles.`,s2:`They meet at ${fmt(Math.round(n*R.range(.49,.53)))} points.`}},
  (R,c)=>{const n=R.int(1,9)+'.'+R.int(10,99);return{num:n,unit:'grams',s1:`This fragment of ${c} weighs ${n} grams.`,s2:'Most of it is nickel-iron.'}},
  (R,c)=>{const n=R.int(2,9);return{num:n+' mm',unit:'',s1:`The fusion crust on ${c} is ${n} mm thick.`,s2:'It formed in the last seconds of the fall.'}},
  (R,c)=>{const n=R.int(11,72);return{num:String(n),unit:'km/s',s1:`${c} entered the atmosphere at ${n} kilometres per second.`,s2:'Most of its mass burned away.'}},
  (R,c)=>{const n=R.int(2,40)*1000;return{num:fmt(n),unit:'years',s1:`${c} sat in the ice for about ${fmt(n)} years.`,s2:'The ice kept it dry and dark.'}},
];
ST.specimen={name:'Specimen',fn(R,C){
  const dark=R.chance(.55),bg=dark?'#141416':'#e9e6df',fg=dark?'#f2f0ea':'#161616',mu=dark?'#8d8d92':'#6d6a64';
  const code=R.pick(['OUT','EET','ALH','MIL','LAP','QUE','NWA'])+' '+R.int(10000,99999),fact=R.pick(FACTS)(R,code);
  const cls=R.pick(CLASSES),found=R.pick(FOUND),orig=R.pick(ORIGIN),scan=R.pick(SCANS),fig=R.int(10,240),of=fig+R.int(20,120),lay=R.pick(['num','num','name','trio']);
  const names=['Elephant Moraine','Three from the ice','Look closely','Six plates','Pure iron','Far from home','Mesosiderites'];
  const nm=R.pick(names);
  let defs='',el='';
  const big=C.T(lay==='num'?fact.num:nm), unit=C.S(lay==='num'?fact.unit:fact.s2.replace(/\.$/,''));
  el+=tx(58,56,'P. WALL',{f:MONO,s:7.5,c:fg,ls:1.4})+tx(150,56,big.toUpperCase().slice(0,18),{f:MONO,s:7.5,c:fg,ls:1.4})+tx(300,56,'METEORITES FROM BEYOND EARTH',{f:MONO,s:7.5,c:fg,ls:1.4})+tx(545,56,`${fig} / ${of}`,{f:MONO,s:7.5,c:fg,ls:1.4,a:'end'});
  if(lay==='num'){
    const s=fit(big,490,SERIF,400,175);
    el+=tx(50,90+s*.72,big,{f:SERIF,s,c:fg,ls:-2});
    el+=tx(54,140+s*.72+(unit?50:0),unit,{f:SERIF,s:70,c:fg,ls:-1});
    const rk=rockSVG(R,C.u,0,230,540,R.range(115,145),!dark);defs+=rk.defs;el+=rk.el;
    el+=tl(360,390,wrap(fact.s1,25),19,{s:15.5,w:500,c:fg,ls:-.2})+tx(360,480,fact.s2,{s:10.5,c:fg});
  } else if(lay==='name'){
    const L=wrap(big,13),s=Math.min(84,fit(L.reduce((a,b)=>a.length>b.length?a:b),300,SERIF,400,84));
    el+=tl(240,130,L,s*.92,{f:SERIF,s,c:fg,ls:-1});
    const pos=[[130,250],[230,420],[160,600]];
    pos.forEach((p,k)=>{const b=R.chance(.5);if(b)el+=`<rect x="${p[0]-62}" y="${p[1]-58}" width="124" height="116" fill="${dark?'#202024':'#dcd8cf'}"/>`;const rk=rockSVG(R,C.u,k,p[0],p[1],R.range(36,48),!dark);defs+=rk.defs;el+=rk.el+tx(p[0]-62,p[1]+76,`Fig. ${fig+k}`,{s:7,c:fg})+tx(p[0]-62,p[1]+86,`${code.split(' ')[0]} ${R.int(10000,99999)}`,{s:7,c:mu})});
    el+=tl(360,560,wrap(fact.s1,26),15,{s:12,w:500,c:fg});
  } else {
    const s=fit(big,500,SERIF,400,92),L=wrap(big,14);
    el+=tl(50,150,L,s*.92,{f:SERIF,s:Math.min(84,s*1.3),c:fg,ls:-1});
    el+=tx(50,320,unit+'.',{s:12,w:500,c:fg})+tx(330,320,'Fragments are shown at relative scale.',{s:9,c:mu});
    [[130,450],[300,450],[470,450]].forEach((p,k)=>{el+=`<rect x="${p[0]-78}" y="${p[1]-90}" width="156" height="180" fill="${dark?'#1f1f23':'#dedad1'}"/>`;const rk=rockSVG(R,C.u,k,p[0],p[1],R.range(44,62),!dark);defs+=rk.defs;el+=rk.el+tx(p[0]-78,p[1]+108,`Fig. ${fig+k}`,{s:7,c:mu})+tx(p[0]-78,p[1]+122,R.pick(['Morasko','Pultusk','Gibeon','Sikhote','Allende','Murchison']),{s:9,w:600,c:fg})});
    el+=tl(50,620,wrap(fact.s1,40),15,{s:12,w:500,c:fg});
  }
  el+=tl(360,640,['CLASS','FOUND','ORIGIN','SCAN'],15,{f:MONO,s:6,c:mu,ls:.8})+tl(410,640,[cls,found,orig,scan],15,{s:10,c:fg});
  el+=`<rect x="64" y="652" width="26" height="26" fill="none" stroke="${fg}" stroke-width=".7"/>`+tx(77,669,'1',{s:11,c:fg,a:'middle'})+`<line x1="300" y1="680" x2="370" y2="680" stroke="${fg}" stroke-width="2"/>`;
  el+=`<line x1="30" y1="712" x2="570" y2="712" stroke="${mu}" stroke-width=".5"/>`;
  [[58,'FIG.',String(fig)],[150,'SPECIMEN',code],[330,'ORIGIN',orig],[420,'FOUND',found],[505,'SCAN',scan.split(' · ')[0]]].forEach(([x,l,v])=>{el+=tx(x,730,l,{f:MONO,s:6,c:mu,ls:.8})+tx(x,750,v,{s:12,w:500,c:fg})});

function renderPoster(spec,uid,opt={}){

  const C={u:uid,seed:spec.seed,
    T:d=>{used.title=d;return spec.title?spec.title:d},
    S:d=>{used.sub=d;return spec.sub?spec.sub:d},
    pal:list=>{const k=R.int(0,list.length-1);return list[(k+(spec.pal||0))%list.length]}};
  const out=ST[spec.style].fn(R,C);

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" ${size}><defs>${opt.css?`<style>${opt.css}</style>`:''}${out.defs}</defs><rect width="600" height="800" fill="${out.bg}"/>${out.el}</svg>`;
  return {svg,used,bg:out.bg}
}
function gridSVG(){let g='<svg class="grid" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg"><g stroke="#5468ff" stroke-width=".7" opacity=".6">';for(let i=0;i<=12;i++){const x=30+i*45;g+=`<line x1="${x}" y1="0" x2="${x}" y2="800"/>`}for(let y=40;y<800;y+=32)g+=`<line x1="0" y1="${y}" x2="600" y2="${y}"/>`;return g+'</g></svg>'}
const GRID=gridSVG();

let enabled=store.get('pw.styles',STYLE_KEYS.slice());enabled=enabled.filter(k=>ST[k]);if(!enabled.length)enabled=STYLE_KEYS.slice();

function cellSpec(i,j){const seed=hash(i+7919,j+104729,wallSeed);const style=enabled[hash(seed,31)%enabled.length];return Object.assign({seed,style,pal:0},overrides[i+','+j]||{})}

const view=document.getElementById('view'),world=document.getElementById('world');
const cam={x:0,y:0,z:.36};const cells=new Map();let queue=[];let ver=0;

function cellEl(i,j){const el=document.createElement('div');el.className='poster';el.style.left=i*(W+G)+'px';el.style.top=j*(H+G)+'px';el.dataset.i=i;el.dataset.j=j;world.appendChild(el);return el}
function paint(i,j){const c=cells.get(i+','+j);if(!c)return;const spec=cellSpec(i,j);const r=renderPoster(spec,`c${i+5000}_${j+5000}_${ver++}_`);c.el.innerHTML=r.svg+GRID;c.el.style.background=r.bg;c.used=r.used;c.spec=spec;c.done=true}
function update(){
  const vw=innerWidth,vh=innerHeight,x0=Math.floor((-cam.x/cam.z)/(W+G))-1,x1=Math.ceil((vw-cam.x)/cam.z/(W+G)),y0=Math.floor((-cam.y/cam.z)/(H+G))-1,y1=Math.ceil((vh-cam.y)/cam.z/(H+G));
  const keep=new Set();
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){const k=i+','+j;keep.add(k);if(!cells.has(k)){cells.set(k,{el:cellEl(i,j),i,j,done:false});queue.push(k)}}
  for(const [k,c] of cells)if(!keep.has(k)&&!(focus&&focus.k===k)){c.el.remove();cells.delete(k)}
  const cxw=(vw/2-cam.x)/cam.z,cyw=(vh/2-cam.y)/cam.z;
  queue=queue.filter(k=>cells.has(k)&&!cells.get(k).done).sort((a,b)=>{const d=k=>{const [i,j]=k.split(',').map(Number);return Math.hypot(i*(W+G)+W/2-cxw,j*(H+G)+H/2-cyw)};return d(a)-d(b)});
}

  if(instant){Object.assign(cam,t);apply()}else tween(t);
  update();let c=cells.get(k);if(c&&!c.done)paint(i,j);c&&c.el.classList.add('on');syncPanel();$('panel').hidden=false;$('ftop').hidden=false;$('chips').hidden=true;$('top').hidden=true;$('hint').hidden=true}
function closeFocus(){if(!focus)return;const c=cells.get(focus.k);c&&c.el.classList.remove('on');const cx=innerWidth/2,cy=innerHeight/2,f=wallZ/cam.z;tween({x:cx-(cx-cam.x)*f,y:cy-(cy-cam.y)*f,z:wallZ});focus=null;document.body.classList.remove('focus');$('panel').hidden=true;$('ftop').hidden=true;$('chips').hidden=false;$('top').hidden=false;$('hint').hidden=false}
function syncPanel(){const c=cells.get(focus.k);if(!c||!c.spec)return;$('stylename').textContent=ST[c.spec.style].name;$('t1').value=c.spec.title||c.used.title||'';$('t2').value=c.spec.sub||c.used.sub||'';$('fmeta').textContent=`${ST[c.spec.style].name} · No. ${String(c.spec.seed%1000).padStart(3,'0')} · ${c.spec.seed.toString(16)}`}
function edit(ch){const k=focus.k;overrides[k]=Object.assign({},overrides[k]||{},ch);for(const key in overrides[k])if(overrides[k][key]===''||overrides[k][key]==null)delete overrides[k][key];save();paint(focus.i,focus.j);cells.get(k).el.classList.add('on');syncPanel()}
const cur=()=>cells.get(focus.k).spec;
$('back').onclick=closeFocus;
$('prevS').onclick=()=>{const s=cur();edit({style:STYLE_KEYS[(STYLE_KEYS.indexOf(s.style)+STYLE_KEYS.length-1)%STYLE_KEYS.length],title:'',sub:''})};
$('nextS').onclick=()=>{const s=cur();edit({style:STYLE_KEYS[(STYLE_KEYS.indexOf(s.style)+1)%STYLE_KEYS.length],title:'',sub:''})};
$('remix').onclick=()=>edit({seed:(Math.random()*4294967295)>>>0,style:cur().style});
$('colour').onclick=()=>edit({pal:(cur().pal||0)+1});
let tmr;$('t1').oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>edit({title:e.target.value}),120)};$('t2').oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>edit({sub:e.target.value}),120)};
$('reset').onclick=()=>{delete overrides[focus.k];save();paint(focus.i,focus.j);cells.get(focus.k).el.classList.add('on');syncPanel()};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
$('link').onclick=async()=>{const s=cur();const code='p'+[STYLE_KEYS.indexOf(s.style),s.seed.toString(36),(s.pal||0)].join('.')+'.'+btoa(unescape(encodeURIComponent(JSON.stringify([s.title||'',s.sub||''])))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');const url=location.href.split('#')[0]+'#'+code;try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){prompt('Copy link',url)}};
function readHash(){const h=location.hash.slice(1);if(!h.startsWith('p'))return null;try{const [a,b,c,...rest]=h.slice(1).split('.');const d=rest.join('.');const [t,s]=JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/')))));return {style:STYLE_KEYS[+a],seed:parseInt(b,36),pal:+c,title:t||undefined,sub:s||undefined}}catch(e){return null}}

/* PNG export with embedded fonts */
let cssCache=null;
async function toData(url){const b=await (await fetch(url)).blob();return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
async function fontCSS(){if(cssCache)return cssCache;let out='';for(const id of['fontcss','jpcss']){const css=await (await fetch(document.getElementById(id).href)).text();const blocks=css.match(/@font-face\s*{[^}]*}/g)||[];for(let b of blocks){if(/unicode-range/.test(b)&&!/U\+0000-00FF/.test(b))continue;const m=b.match(/url\(([^)]+)\)/);if(m)b=b.replace(m[1],await toData(m[1].replace(/['"]/g,'')));out+=b}}return cssCache=out}
$('png').onclick=async()=>{const s=cur();toast('Rendering PNG…');try{const css=await fontCSS();const {svg}=renderPoster(s,'x_',{w:1800,h:2400,css});const img=new Image();img.src=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));await img.decode();await new Promise(r=>setTimeout(r,150));const cv=document.createElement('canvas');cv.width=1800;cv.height=2400;const ctx=cv.getContext('2d');ctx.drawImage(img,0,0);ctx.drawImage(img,0,0);cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`poster-${s.style}-${s.seed.toString(36)}.png`;a.click();toast('Saved PNG')},'image/png')}catch(e){console.error(e);toast('PNG export failed')}};

/* chrome */
function chips(){const c=$('chips');c.innerHTML='';STYLE_KEYS.forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=ST[k].name;b.setAttribute('aria-pressed',enabled.includes(k));b.onclick=()=>{if(enabled.includes(k)){if(enabled.length>1)enabled=enabled.filter(x=>x!==k)}else enabled.push(k);enabled=STYLE_KEYS.filter(x=>enabled.includes(x));save();chips();repaintAll()};c.appendChild(b)})}
function repaintAll(){for(const c of cells.values()){c.done=false;queue.push(c.i+','+c.j)}update()}
$('shuffle').onclick=()=>{wallSeed=(Math.random()*1e9)|0;overrides={};save();repaintAll()};
let gridOn=store.get('pw.grid',true);const syncGrid=()=>{document.body.classList.toggle('nogrid',!gridOn);$('gridBtn').setAttribute('aria-pressed',gridOn)};
$('gridBtn').onclick=()=>{gridOn=!gridOn;store.set('pw.grid',gridOn);syncGrid()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(focus){if(e.key==='Escape')closeFocus();const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();openFocus(focus.i+d[0],focus.j+d[1])}if(e.key==='r')$('remix').click();if(e.key==='c')$('colour').click();if(e.key==='['||e.key===',')$('prevS').click();if(e.key===']'||e.key==='.')$('nextS').click()}
  else{if(e.key==='s')$('shuffle').click();const d={ArrowLeft:[1,0],ArrowRight:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(d){cam.x+=d[0]*200;cam.y+=d[1]*200;apply()}}
  if(e.key==='g')$('gridBtn').click()});

/* boot */
(async()=>{
  const fams=['900 40px Archivo','300 40px Archivo','italic 300 40px Archivo','700 40px "Inter Tight"','500 40px "Inter Tight"','300 40px "Inter Tight"','italic 300 40px "Inter Tight"','40px "Instrument Serif"','italic 40px "Instrument Serif"','700 40px Fraunces','italic 900 40px Fraunces','400 40px "JetBrains Mono"','300 40px "Lexend Peta"','200 40px "Lexend Peta"','900 40px Unbounded','600 40px Unbounded'];
  try{await Promise.race([Promise.all(fams.map(f=>document.fonts.load(f)).concat([document.fonts.load('900 40px "Noto Sans JP"','大阪'),document.fonts.load('500 40px "Noto Sans JP"','光')])),new Promise(r=>setTimeout(r,6000))])}catch(e){}
  _mc.font='900 100px Archivo';const m=_mc.measureText('H');if(m.actualBoundingBoxAscent)CAP_ARCH=m.actualBoundingBoxAscent/100;
  $('loading').remove();chips();syncGrid();
  const hs=readHash();if(hs&&hs.style){overrides['0,0']=Object.fromEntries(Object.entries(hs).filter(([,v])=>v!==undefined));save()}
  centerOn(0,0,innerWidth<640?.3:.36);apply();pump();
  if(hs&&hs.style)setTimeout(()=>openFocus(0,0,true),50);
})();
</script>
